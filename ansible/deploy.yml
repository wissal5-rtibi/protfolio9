- name: Déploiement Portfolio9
  hosts: linux_servers
  become: yes

  tasks:

    - name: Mettre à jour le système
      apt:
        update_cache: yes
        state: present

    - name: Installer dépendances de base
      apt:
        name:
          - git
          - curl
          - nginx
          - docker.io
        state: present

    - name: Activer Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Installer Docker Compose v2
      shell: |
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 \
        -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

    - name: Vérifier Docker Compose
      shell: docker compose version

    - name: Cloner le repo GitHub
      git:
        repo: https://github.com/wissal5-rtibi/protfolio9.git
        dest: /app
        force: yes

    - name: Stop containers existants
      shell: |
        cd /app 
        docker compose down 

    - name: Build & run application
      shell: |
        cd /app
        docker compose up --build -d 

    - name: Configurer Nginx
      copy:
        dest: /etc/nginx/sites-available/portfolio9
        content: |
          server {
              listen 80;

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }

              location /api {
                  proxy_pass http://localhost:5002;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }

    - name: Activer Nginx
      shell: |
        ln -sf /etc/nginx/sites-available/portfolio9 /etc/nginx/sites-enabled/
        rm -f /etc/nginx/sites-enabled/default
        nginx -t
        systemctl restart nginx
        systemctl enable nginx

    - name: Deployment Success
      debug:
        msg: "✅ Portfolio9 déployé avec succès !"
