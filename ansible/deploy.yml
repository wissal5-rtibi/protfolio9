---
- name: Déploiement Portfolio9
  hosts: linux_servers
  become: yes

  tasks:
    - name: Mettre à jour le système
      apt:
        update_cache: yes
        upgrade: yes

    - name: Installer les dépendances
      apt:
        name:
          - docker.io
          - docker-compose
          - git
          - nginx
          - curl
        state: present

    - name: Installer Node.js
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
        apt install -y nodejs

    - name: Installer PM2
      shell: npm install -g pm2

    - name: Installer MongoDB
      shell: |
        curl -fsSL https://www.mongodb.org/static/pgp/server-6.0.asc | gpg -o /usr/share/keyrings/mongodb-server-6.0.gpg --dearmor
        echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
        apt update
        apt install -y mongodb-org

    - name: Démarrer MongoDB
      systemd:
        name: mongod
        state: started
        enabled: yes

    - name: Démarrer Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Cloner le repo GitHub
      git:
        repo: https://github.com/wissal5-rtibi/protfolio9.git
        dest: /app
        force: yes

    - name: Arrêter les conteneurs existants
      shell: |
        cd /app
        docker compose down || true

    - name: Lancer l'application avec Docker Compose
      shell: |
        cd /app
        docker compose up --build -d

    - name: Configurer Nginx comme reverse proxy
      copy:
        dest: /etc/nginx/sites-available/portfolio9
        content: |
          server {
              listen 80;
              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              location /api {
                  proxy_pass http://localhost:5002;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }

    - name: Activer le site Nginx
      shell: |
        ln -sf /etc/nginx/sites-available/portfolio9 /etc/nginx/sites-enabled/
        rm -f /etc/nginx/sites-enabled/default
        nginx -t
        systemctl restart nginx

    - name: Démarrer Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Deployment Success
      debug:
        msg: "✅ Portfolio9 déployé avec succès !"
