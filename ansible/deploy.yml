---
- name: Déploiement Portfolio9
  hosts: linux_servers
  become: yes

  tasks:
    - name: Mettre à jour le code
      git:
        repo: https://github.com/wissal5-rtibi/protfolio9.git
        dest: /home/ubuntu/mon-app_protfolio/protfolio9
        force: yes

    - name: Arrêter les conteneurs
      shell: |
        cd /home/ubuntu/mon-app_protfolio/protfolio9
        /usr/local/lib/docker/cli-plugins/docker-compose down || true

    - name: Lancer l'application
      shell: |
        cd /home/ubuntu/mon-app_protfolio/protfolio9
        /usr/local/lib/docker/cli-plugins/docker-compose up --build -d

    - name: Vérifier les conteneurs
      shell: |
        cd /home/ubuntu/mon-app_protfolio/protfolio9
        /usr/local/lib/docker/cli-plugins/docker-compose ps
      register: status

    - name: Afficher le statut
      debug:
        msg: "{{ status.stdout }}"

    - name: Deployment Success
      debug:
        msg: "✅ Portfolio9 déployé avec succès !"
