name: CI/CD Pipeline - Portfolio9

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        run: docker build -t protfolio9-frontend:latest ./frontend

      - name: Build Backend image
        run: docker build -t protfolio9-backend:latest ./backend

      - name: Run Backend tests
        run: |
          cd backend
          npm install
          npm test --if-present || true

      - name: Verify Kubernetes manifests
        run: |
          echo "Verifying Kubernetes manifests..."
          cat k8s/secret.yaml
          cat k8s/backend-deployment.yaml
          cat k8s/frontend-deployment.yaml
          echo "All manifests verified!"

  terraform:
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.ec2_ip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Cleanup existing AWS resources
        run: |
          # Supprimer ALB existant
          ALB_ARN=$(aws elbv2 describe-load-balancers --names portfolio9-alb-v2 --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || echo "")
          if [ ! -z "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            aws elbv2 delete-load-balancer --load-balancer-arn $ALB_ARN
            echo "ALB supprimé"
            sleep 30
          fi

          # Supprimer Target Group existant
          TG_ARN=$(aws elbv2 describe-target-groups --names portfolio9-tg-v2 --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
          if [ ! -z "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            aws elbv2 delete-target-group --target-group-arn $TG_ARN
            echo "Target Group supprimé"
          fi

          # Supprimer Security Groups existants
          aws ec2 delete-security-group --group-name portfolio9-ec2-sg-v2 2>/dev/null || true
          aws ec2 delete-security-group --group-name portfolio9-alb-sg-v2 2>/dev/null || true

      - name: Terraform Apply
        run: cd terraform && terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_output
        run: |
          cd terraform
          EC2_IP=$(terraform output -raw instance_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "EC2 IP: $EC2_IP"

  ansible:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: sudo apt install -y ansible

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ma-cle-aws.pem
          chmod 600 ~/.ssh/ma-cle-aws.pem

      - name: Update inventory with new EC2 IP
        run: |
          cat > ansible/inventory.ini << INVENTORY
          [linux_servers]
          ${{ needs.terraform.outputs.ec2_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ma-cle-aws.pem

          [linux_servers:vars]
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          INVENTORY
          echo "=== Inventory ==="
          cat ansible/inventory.ini

      - name: Wait for EC2 to be ready
        run: sleep 120

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory.ini deploy.yml

      - name: Deployment Success
        run: |
          echo "✅ Déploiement terminé avec succès!"
          echo "🌐 Frontend: http://${{ needs.terraform.outputs.ec2_ip }}:8080"
          echo "⚙️ Backend:  http://${{ needs.terraform.outputs.ec2_ip }}:5002"
