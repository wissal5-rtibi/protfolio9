name: CI/CD Pipeline - Portfolio9

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        run: docker build -t protfolio9-frontend:latest ./frontend

      - name: Build Backend image
        run: docker build -t protfolio9-backend:latest ./backend

      - name: Run Backend tests
        run: |
          cd backend
          npm install
          npm test --if-present || true

      - name: Verify Kubernetes manifests
        run: |
          echo "Verifying Kubernetes manifests..."
          cat k8s/secret.yaml
          cat k8s/backend-deployment.yaml
          cat k8s/frontend-deployment.yaml
          echo "All manifests verified!"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mon-app_protfolio/protfolio9
            git pull origin master
            sudo docker compose down
            sudo docker compose up --build -d
            echo "✅ Déploiement réussi !"

      - name: Deployment Success
        run: |
          echo "✅ Build et déploiement terminés avec succès!"
          echo "📦 Images: protfolio9-frontend, protfolio9-backend"
          echo "🚀 Application disponible sur http://${{ secrets.EC2_HOST }}:8080"
